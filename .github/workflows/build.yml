name: Build OZ-mosys (Windows + Mac)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build plugin and standalone app
        shell: pwsh
        run: |
          cmake --build build --config Release --target OZmosys_VST3 OZmosys_Standalone --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\OZ-mosys.iss

      - name: Zip the plain files too
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\OZmosys_artefacts\Release\VST3\OZ-mosys.vst3" dist\
          Copy-Item "build\OZmosys_artefacts\Release\Standalone\OZ-mosys.exe" dist\
          Compress-Archive -Path dist\* -DestinationPath OZ-mosys-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installer/Output/OZ-mosys-Setup.exe
            OZ-mosys-Windows.zip

      - name: Show what went wrong
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in @("configure.log", "build.log")) {
            if (Test-Path $f) {
              Get-Content $f | Select-String -Pattern "error|Error|fatal|not found|Could not" | Select-Object -Last 8 | ForEach-Object {
                $line = $_.Line -replace "%", "%25" -replace "`r", "" -replace "`n", " "
                Write-Output "::error title=$f::$line"
              }
            }
          }

  # ---------------------------------------------------------------------- Mac
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure (Apple Silicon + Intel)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 2>&1 | tee configure.log
          exit ${PIPESTATUS[0]}

      - name: Build AU, VST3 and standalone app
        run: |
          cmake --build build --target OZmosys_AU OZmosys_VST3 OZmosys_Standalone --parallel 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Make the Mac installer (.pkg)
        run: |
          A=build/OZmosys_artefacts/Release
          ROOT=pkgroot
          mkdir -p "$ROOT/Library/Audio/Plug-Ins/Components" "$ROOT/Library/Audio/Plug-Ins/VST3" "$ROOT/Applications"
          cp -R "$A/AU/OZ-mosys.component" "$ROOT/Library/Audio/Plug-Ins/Components/"
          cp -R "$A/VST3/OZ-mosys.vst3"     "$ROOT/Library/Audio/Plug-Ins/VST3/"
          cp -R "$A/Standalone/OZ-mosys.app" "$ROOT/Applications/"
          # ad-hoc signatures so Apple Silicon Macs will load the plugins
          codesign --force --deep -s - "$ROOT/Library/Audio/Plug-Ins/Components/OZ-mosys.component"
          codesign --force --deep -s - "$ROOT/Library/Audio/Plug-Ins/VST3/OZ-mosys.vst3"
          codesign --force --deep -s - "$ROOT/Applications/OZ-mosys.app"
          pkgbuild --root "$ROOT" --identifier com.ozmosys.synth --version 0.2.0 --install-location / OZ-mosys-Mac.pkg
          (cd "$ROOT/Library/Audio/Plug-Ins" && zip -qry "$GITHUB_WORKSPACE/OZ-mosys-Mac.zip" Components/OZ-mosys.component VST3/OZ-mosys.vst3)

      - name: Check the AU passes Apple's validator
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R pkgroot/Library/Audio/Plug-Ins/Components/OZ-mosys.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i ozmo || true
          auval -v aumu Ozms Ozmo | tail -15

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            OZ-mosys-Mac.pkg
            OZ-mosys-Mac.zip

      - name: Show what went wrong
        if: failure()
        run: |
          for f in configure.log build.log; do
            [ -f "$f" ] && grep -E "error|Error|fatal|not found" "$f" | tail -8 | while read -r l; do echo "::error title=$f::${l//%/%25}"; done
          done; true

  # ------------------------------------------------------------------ Release
  release:
    needs: [ windows, mac ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Remove the previous "latest" build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --cleanup-tag -y --repo "${{ github.repository }}" || true

      - name: Publish to the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: OZ-mosys - latest build
          body: |
            **Windows:** download **OZ-mosys-Setup.exe**, double-click it, then rescan plugins in your DAW.
            **Mac (AU + VST3):** download **OZ-mosys-Mac.pkg**, right-click it and choose **Open** (it isn't signed with an Apple developer certificate yet), then rescan plugins.
            The .zip files hold the same plugins if you'd rather copy them by hand.
          prerelease: false
          make_latest: true
          files: |
            out/OZ-mosys-Setup.exe
            out/OZ-mosys-Windows.zip
            out/OZ-mosys-Mac.pkg
            out/OZ-mosys-Mac.zip
