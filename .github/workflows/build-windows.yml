name: Build OZ-mosys for Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build plugin and standalone app
        shell: pwsh
        run: |
          cmake --build build --config Release --target OZmosys_VST3 OZmosys_Standalone --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Make the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\OZ-mosys.iss

      - name: Zip the plain files too
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build\OZmosys_artefacts\Release\VST3\OZ-mosys.vst3" dist\
          Copy-Item "build\OZmosys_artefacts\Release\Standalone\OZ-mosys.exe" dist\
          Compress-Archive -Path dist\* -DestinationPath OZ-mosys-Windows.zip -Force

      - name: Keep the files on this build
        uses: actions/upload-artifact@v4
        with:
          name: OZ-mosys-Windows
          path: |
            installer/Output/OZ-mosys-Setup.exe
            OZ-mosys-Windows.zip

      - name: Publish to the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: OZ-mosys - latest build
          body: |
            Download **OZ-mosys-Setup.exe**, double-click it, then rescan plugins in FL Studio.
            (OZ-mosys-Windows.zip has the same files if you'd rather copy them by hand.)
          prerelease: false
          make_latest: true
          files: |
            installer/Output/OZ-mosys-Setup.exe
            OZ-mosys-Windows.zip

      - name: Show what went wrong
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in @("configure.log", "build.log")) {
            if (Test-Path $f) {
              Get-Content $f | Select-String -Pattern "error|Error|fatal|not found|Could not" | Select-Object -Last 8 | ForEach-Object {
                $line = $_.Line -replace "%", "%25" -replace "`r", "" -replace "`n", " "
                Write-Output "::error title=$f::$line"
              }
              Get-Content $f | Select-Object -Last 3 | ForEach-Object { Write-Output "::warning title=$f tail::$($_ -replace '%','%25')" }
            }
          }
